name: 'Docket SEO audit'
description: 'Crawl a site and fail the build on SEO regressions. Apple Silicon macOS runners only.'
author: 'docketseo.app'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  url:
    description: 'Site to audit. https:// is assumed if omitted.'
    required: true
  fail-on:
    description: >-
      Severity at which to fail the build: critical, high, medium, low, notice
      or never. Defaults to critical, deliberately — almost every real site
      carries HIGH findings, and a gate that fails on ordinary work gets
      disabled within a month.
    required: false
    default: 'critical'
  pages:
    description: 'Maximum pages to crawl.'
    required: false
    default: '100'
  format:
    description: >-
      Output format. "text" prints to the log. "sarif" writes a file for
      github/codeql-action/upload-sarif (Security tab). "junit" writes a file
      for a test-report action. See output-file.
    required: false
    default: 'text'
  output-file:
    description: 'Where to write the report when format is sarif or junit.'
    required: false
    default: 'docket-report'
  render:
    description: >-
      Run this many pages through WebKit before checking them. Considerably
      slower; leave at 0 unless a check needs the rendered DOM.
    required: false
    default: '0'
  version:
    description: >-
      Docket release tag to install, e.g. v0.1.46. The DMG filename is derived
      from it, so any published tag works.
    required: false
    default: 'v1.1.95'

outputs:
  exit-code:
    description: '0 clean, 2 findings at or above the threshold, 1 Docket could not run.'
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    # Docket is Apple Silicon only. Failing here with a sentence someone can act
    # on beats failing later inside hdiutil with a message about a corrupt
    # image, which is what an ubuntu-latest run would otherwise produce.
    - name: Check the runner
      shell: bash
      run: |
        if [ "$(uname -s)" != "Darwin" ] || [ "$(uname -m)" != "arm64" ]; then
          echo "::error::Docket runs on Apple Silicon macOS only. This runner is $(uname -s)/$(uname -m)."
          echo "::error::Use 'runs-on: macos-latest'. For a Linux-only pipeline, Screaming Frog's CLI is the right tool."
          exit 1
        fi

    - name: Install Docket
      shell: bash
      run: |
        set -euo pipefail
        # The DMG is named for the version, so the filename has to be derived
        # from the tag rather than written next to it.
        #
        # It was hardcoded to Docket-0.1.0-arm64.dmg while `version` was passed
        # into the URL path, which made the input decorative: the default
        # worked, and every other value 404'd on an asset that does not exist
        # in that release. Anyone who set `version:` as the description told
        # them to got a failed step. Verified 2026-08-12 —
        # v0.1.46/Docket-0.1.0-arm64.dmg returns 404 and
        # v0.1.46/Docket-0.1.46-arm64.dmg returns 200.
        TAG="${{ inputs.version }}"
        DMG="Docket-${TAG#v}-arm64.dmg"
        curl -fsSL -o "$RUNNER_TEMP/docket.dmg" \
          "https://github.com/mattkerr09/docket-site/releases/download/${TAG}/${DMG}"
        hdiutil attach -nobrowse -quiet "$RUNNER_TEMP/docket.dmg" -mountpoint "$RUNNER_TEMP/docket-vol"
        cp -R "$RUNNER_TEMP/docket-vol/Docket.app" "$RUNNER_TEMP/Docket.app"
        hdiutil detach "$RUNNER_TEMP/docket-vol" -quiet
        # The DIRECTORY goes on PATH, not a symlink to the binary: the WebKit
        # render helper is its sibling and moving the executable away from it
        # is how --render stops working.
        echo "$RUNNER_TEMP/Docket.app/Contents/Resources/docket" >> "$GITHUB_PATH"

    - name: Audit
      id: audit
      shell: bash
      run: |
        set -uo pipefail
        args=(audit "${{ inputs.url }}" -n "${{ inputs.pages }}" --fail-on "${{ inputs.fail-on }}")
        if [ "${{ inputs.render }}" != "0" ]; then
          args+=(--render "${{ inputs.render }}")
        fi
        case "${{ inputs.format }}" in
          sarif) docket "${args[@]}" -f sarif > "${{ inputs.output-file }}.sarif" ;;
          junit) docket "${args[@]}" -f junit > "${{ inputs.output-file }}.xml" ;;
          *)     docket "${args[@]}" ;;
        esac
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # 1 means Docket itself could not run, which is a different problem from
        # a site with findings and must not be reported as one.
        if [ "$code" = "1" ]; then
          echo "::error::Docket could not run. This is a tool failure, not a finding about the site."
        fi
        exit $code
