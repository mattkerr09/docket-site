# NOT the deploy path. See scripts/deploy.sh.
#
# This workflow failed three times running with "The job was not acquired by
# Runner of type hosted" — GitHub-side runner starvation, each attempt sitting
# in the queue 15+ minutes. Deploys now go through scripts/deploy.sh, which
# pushes site/ to the gh-pages branch and needs no runner at all. Kept as a
# fallback and to run the quality gate on pushes if a runner is ever available.
name: Quality gate (fallback)

# GitHub Pages' built-in "deploy from a folder" only accepts / or /docs, and the
# site lives in /site so the scripts and datasets stay out of the served tree.
# The Actions deployment can publish any directory, which is why this exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because a half-finished
# deploy that gets cancelled can leave the live site mid-update.
concurrency:
  group: pages
  cancel-in-progress: false

# One job, not two. As separate jobs this needed two hosted runners, and two
# consecutive deploys failed with "job was not acquired by Runner of type
# hosted" — runner starvation on GitHub's side, nothing to do with the site.
# The gate is just as blocking as a step: if it exits non-zero the job stops
# before the upload, so nothing unlinted can reach the live site.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate runs against the COMMITTED html, not a fresh build. What ships
      # is what is in the repo, so that is what has to pass.
      - name: Voice, thin and duplicate gate
        run: python3 scripts/lint.py site

